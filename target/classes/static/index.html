<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Contact Management System</title>

    <style>

        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 0;
        }

        .container {
            width: 450px;
            margin: 60px auto;
            background-color: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 0 10px rgba(0,0,0,0.2);
        }

        h1 {
            text-align: center;
        }

        label {
            display: block;
            margin-top: 12px;
            font-weight: bold;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 6px;
            box-sizing: border-box;
        }

        button {
            width: 100%;
            padding: 12px;
            margin-top: 20px;
            background-color: #333;
            color: white;
            border: none;
            cursor: pointer;
        }

        #message {
            text-align: center;
            margin-top: 20px;
            font-weight: bold;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>Contact Management System</h1>

    <form id="contactForm">

        <label>Name</label>

        <input
            type="text"
            id="name"
            placeholder="Enter Name"
            required
        >

        <label>Email</label>

        <input
            type="email"
            id="email"
            placeholder="Enter Email"
            required
        >

        <label>Phone</label>

        <input
            type="tel"
            id="phone"
            placeholder="Enter Phone"
            required
        >

        <button
            type="submit"
            id="addContact">
            Add Contact
        </button>

    </form>

    <div id="message"></div>

</div>

<script>

    document
        .getElementById("contactForm")
        .addEventListener("submit", function(event) {

            event.preventDefault();

            const name =
                document.getElementById("name").value;

            const email =
                document.getElementById("email").value;

            const phone =
                document.getElementById("phone").value;

            document.getElementById("message").innerText =
                "Contact Added Successfully: " +
                name + " | " +
                email + " | " +
                phone;

        });

</script>

</body>

</html>
